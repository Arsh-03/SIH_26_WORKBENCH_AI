[project]
name = "sih-workbench-backend"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench - Backend Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pymupdf>=1.23.0",
    "chromadb>=0.4.24",
    "psutil>=5.9.8",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "aiofiles>=23.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
